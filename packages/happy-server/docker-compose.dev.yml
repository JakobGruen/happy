# packages/happy-server/docker-compose.dev.yml
# Local development services — Postgres + Redis
# Used by `bun dev` from the monorepo root.

services:
  postgres:
    image: postgres:16
    container_name: happy-dev-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: handy
    ports:
      - "5432:5432"
    volumes:
      - happy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: happy-dev-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  happy-pgdata:
